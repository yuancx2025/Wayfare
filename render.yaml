# Free web service for the FastAPI backend. A free instance sleeps when idle; the app says so while the first
# request waits. Set the secret env vars in the Render dashboard. They are not committed here.
services:
  - type: web
    name: wayfare-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
